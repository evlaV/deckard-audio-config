context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.name = "filter-chain-sink"
            node.description = "Filter Chain Sink"
            media.name = "Filter Chain Sink"
            filter.graph = {
                nodes = [
                    {
                        type = builtin name = eq_band_1
                        label = bq_highpass
                        control = { "Freq" = 100.0 "Q" = 0.7071 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_lowshelf
                        control = { "Freq" = 200.0 "Q" = 0.7071 "Gain" = -6.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_highshelf
                        control = { "Freq" = 8000.0 "Q" = 1.0 "Gain" = 8.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 4200.0 "Q" = 2.0 "Gain" = -13.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 400.0 "Q" = 2.0 "Gain" = -8.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_6
                        label = bq_peaking
                        control = { "Freq" = 3000.0 "Q" = 3.0 "Gain" = -8.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_7
                        label = bq_peaking
                        control = { "Freq" = 8000.0 "Q" = 1.7 "Gain" = 12.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_8
                        label = bq_peaking
                        control = {"Freq" = 200.0 "Q" = 1.0 "Gain" = -3.0 }
                    }
                    {
                        type = builtin
                        name = eq_band_9
                        label = bq_peaking
                        control = {"Freq" = 3400.0 "Q" = 4.0 "Gain" = -6.5 }
                    }
                    {
                        type = builtin
                        name = eq_band_10
                        label = bq_peaking
                        control = {"Freq" = 10500.0 "Q" = 4.0 "Gain" = -5.0 }
                    }
                    #{
                     #   type = ladspa
                     #   name = compressor
                     #   plugin = /usr/lib/ladspa/caps.so
                     #   label = Compress
                     #   control = {
                     #       "measure" 1
                     #       "mode" 1
                     #       "threshold" -20.0
                     #       "strength" 0.40
                     #       "attack" 0.01
                     #      "release" 0.1
                     #       "gain (dB)" 8.0
                   # }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                    { output = "eq_band_7:Out" input = "eq_band_8:In" }
                    { output = "eq_band_8:Out" input = "eq_band_9:In" }
                    { output = "eq_band_9:Out" input = "eq_band_10:In" }
                   # { output = "eq_band_7:Out" input = "eq_band_8:In" }
                   # { output = "eq_band_8:Out" input = "eq_band_9:In" }
                   # { output = "eq_band_9:Out" input = "eq_band_10:In" }
                   # { output = "eq_band_9:Out" input = "compressor:in" }
                ]
            }
            capture.props = {
                node.name = "filter-chain-sink"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.name = filter-chain-sink
                filter.smart.target = { media.class = Audio/Sink, node.name = "~alsa_output.platform-*" }
                filter.smart.after = [ virtual-sink ]
            }
            playback.props = {
                node.name = "filter-chain-playback"
                node.passive = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
