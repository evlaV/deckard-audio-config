context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "AEC Speaker Reference"
            media.name = "AEC Speaker Reference"
            filter.graph = {
                nodes = [
                    {
                        type = ladspa
                        name = dsp_stereo_spkr_ref
                        plugin = /usr/lib/ladspa/audiofilter.so
                        label = dsp_stereo_spkr_ref
                    }
                ]
            }
            capture.props = {
                node.name = "speaker-ref-sink"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.name = speaker-ref-sink
                filter.smart.after = [ filter-chain-sink ]
            }
            playback.props = {
                node.name = "speaker-ref-playback"
                node.passive = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
