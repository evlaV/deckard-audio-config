context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.name = "Built-in Speakers"
            node.description = "Built-in Speakers"
            media.name = "Built-in Speakers"
            filter.graph = {
                nodes = [

                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 108.0 "Q" = 0.71 "Gain" = 5.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 152.0 "Q" = 1.2 "Gain" = -4.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_highshelf
                        control = { "Freq" = 210.0 "Q" = 0.71 "Gain" = -6.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_lowshelf
                        control = { "Freq" = 1085.0 "Q" = 1.0 "Gain" = 2.5 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 3069.0 "Q" = 3.5 "Gain" = -10.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_peaking
                        control = { "Freq" = 4096.0 "Q" = 0.6 "Gain" = -4.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_7
                        label = bq_highshelf
                        control = { "Freq" = 6137.0 "Q" = 3.5 "Gain" = -10.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_8
                        label = bq_peaking
                        control = { "Freq" = 8123.0 "Q" = 3.0 "Gain" = 6.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_9
                        label = bq_highshelf
                        control = { "Freq" = 16384.0 "Q" = 0.71 "Gain" = -10.0 }
                    }
                    {
                        type = ladspa
                        name = compressor
                        plugin = /usr/lib/ladspa/caps.so
                        label = Compress
                        control = {
                            "measure" 1
                            "mode" 1
                            "threshold" 0.75
                            "strength" 0.2
                            "attack" 0.75
                            "release" 0.5
                            "gain (dB)" 5
                        }
                    }

                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                    { output = "eq_band_6:Out" input = "eq_band_7:In" }
                    { output = "eq_band_7:Out" input = "eq_band_8:In" }
                    { output = "eq_band_8:Out" input = "eq_band_9:In" }
                    { output = "eq_band_9:Out" input = "compressor:in"}
                ]

            }
            capture.props = {
                node.name = "Built-in Speakers_capture"
                media.class = Audio/Sink
                priority.session = 1200
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "Built-in Speakers_playback"
                node.passive = true
                node.target = "alsa_output.platform-6b80000.lpass.playback.0.0"
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
