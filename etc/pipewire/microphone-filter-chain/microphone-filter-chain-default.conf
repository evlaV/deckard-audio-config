context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.name =  "filter-chain-source"
            node.description =  "Filter Chain Source"
            media.name =  "Filter Chain Source"
            filter.graph = {
               nodes = [
                   {
                        type = builtin name = eq_band_1
                        label = bq_highpass
                        control = { "Freq" = 100.0 "Q" = 0.7071 "Gain" = 0.0 }
                    }
                    {
                        type = ladspa
                        name = rnnoise
                        plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                        label = noise_suppressor_mono
                        control = {
                           "VAD Threshold (%)" = 23.0
                           "VAD Grace Period (ms)" = 200
                        }
                    }
                    {
                        type = builtin
                        name = mono_to_stereoL
                        label = copy
                    }
                    {
                        type = builtin
                        name = mono_to_stereoR
                        label = copy
                    }
               ]
               links = [
                    { output = "eq_band_1:Out" input = "rnnoise:Input" }
                    { output = "rnnoise:Output" input = "mono_to_stereoL:In" }
                    { output = "rnnoise:Output" input = "mono_to_stereoR:In" }
               ]
               inputs = [ "eq_band_1:In" ]
               outputs = [ "mono_to_stereoL:Out" "mono_to_stereoR:Out" ]
            }
            capture.props = {
                node.name = "filter-chain-capture"
                node.passive = true
            }
            playback.props = {
                node.name = "filter-chain-source"
                media.class = Audio/Source
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.name = filter-chain-source
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                filter.smart.before = [ filter-chain-ec-source ]
            }
        }
    }
]
