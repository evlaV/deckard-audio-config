context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.name =  "filter-chain-source"
            node.description =  "Filter Chain Source"
            media.name =  "Filter Chain Source"
            filter.graph = {
               nodes = [
                    {
                        type = lv2
                        name = valve_deckard_microphone_neg3p6
                        plugin = "https://faustlv2.bitbucket.io/valve_deckard_microphone_neg3p6"
                        label = valve_deckard_microphone_neg3p6
                    }
                    {
                        type = builtin
                        name = mixer
                        label = mixer
                        # -3dB to keep energy the same
                        control = { "Gain 1" = 0.708, "Gain 2" = 0.708 }
                    }
                    {
                        type = ladspa
                        name = noise_suppressor_mono
                        plugin = /usr/lib/ladspa/audiofilter.so
                        label = noise_suppressor_mono
                        control = {
                           "VAD Threshold (%)" = 23
                           "VAD Grace Period (ms)" = 500
                           "Retroactive VAD Grace (ms)" = 0
                        }
                    }
               ]
               links = [
                    { output = "mixer:Out" input = "noise_suppressor_mono:Input" }
                    { output = "valve_deckard_microphone_neg3p6:out0" input = "mixer:In 1" }
                    { output = "valve_deckard_microphone_neg3p6:out1" input = "mixer:In 2" }
               ]
               inputs = [ "valve_deckard_microphone_neg3p6:in0" "valve_deckard_microphone_neg3p6:in1" ]
               outputs = [ "noise_suppressor_mono:Output" ]
            }
            capture.props = {
                node.name = "filter-chain-capture"
                node.passive = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "filter-chain-source"
                media.class = Audio/Source
                audio.channels = 1
                filter.smart = true
                filter.smart.name = filter-chain-source
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                # FIXME: WirePlumber seems to invert this
                filter.smart.after = [ filter-chain-ec-source filter-chain-ec-stereo ]
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
        }
    }
]
