context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "EC NS DSP"
            media.name =  "EC NS DSP"
            filter.graph = {
               nodes = [
                    {
                        name = downmix
                        type = builtin
                        label = mixer
                    }
                    {
                        type = ladspa
                        name = dsp_mono_mic
                        plugin = /usr/lib/ladspa/audiofilter.so
                        label = dsp_mono_mic
                        control = {
                           "VAD Threshold (%)" = 23
                           "VAD Grace Period (ms)" = 500
                           "Retroactive VAD Grace (ms)" = 0
                           "Startup Delay (ms)" = 30
                           "NS enable" = 1.0
                           # Set this to 1.0 if steamos.filters.mic-eq is false
                           "EQ enable" = 1.0
                           "AEC enable" = 1.0
                        }
                    }
                    {
                        type = builtin
                        name = stereoL
                        label = copy
                    }
                    {
                        type = builtin
                        name = stereoR
                        label = copy
                    }
               ]
               links = [
                    { output = "downmix:Out" input = "dsp_mono_mic:Input" }
                    { output = "dsp_mono_mic:Output" input = "stereoL:In" }
                    { output = "dsp_mono_mic:Output" input = "stereoR:In" }
               ]
               inputs = [ "downmix:In 1", "downmix:In 2" ]
               outputs = [ "stereoL:Out", "stereoR:Out" ]
            }
            capture.props = {
                node.name = "dsp_capture"
                node.passive = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "dsp_source"
                media.class = Audio/Source
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.name = filter-chain-ns
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
        }
    }
]
