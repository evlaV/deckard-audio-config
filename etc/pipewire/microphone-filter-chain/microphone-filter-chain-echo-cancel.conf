context.modules = [
    {
        name = libpipewire-module-echo-cancel
        flags = [ nofail ]
        args = {
            audio.channels = 1
            aec.args = {
                webrtc.noise_suppression = false
                webrtc.voice_detection = false
                webrtc.gain_control = true
            }
            capture.props = {
                node.name = "echo_cancel_capture"
                node.passive = true
                audio.channels = 1
            }
            playback.props = {
                node.name = "echo_cancel_playback"
                node.passive = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            source.props = {
                node.name = "echo_cancel_source"
                audio.channels = 1
                media.class = Audio/Source
                filter.smart = true
                filter.smart.name = filter-chain-ec-source
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                # FIXME: WirePlumber seems to invert this
                filter.smart.before = [ filter-chain-source ]
                filter.smart.after = [ filter-chain-ec-stereo ]
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
            sink.props = {
                node.name = "echo_cancel_sink"
                media.class = Audio/Sink
                filter.smart = true
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart.name = filter-chain-ec-sink
                filter.smart.target = { media.class = Audio/Sink, node.virtual = null }
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
        }
    }
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.name =  "echo_cancel_stereo"
            node.description =  "Echo Cancel Stereo"
            media.name =  "Echo Cancel Stereo"
            filter.graph = {
               nodes = [
                    {
                        type = builtin
                        name = mono
                        label = mixer
                        # -3dB to keep energy the same on upmix
                        control = { "Gain 1" = 0.708 }
                    }
                    {
                        type = builtin
                        name = stereoL
                        label = copy
                    }
                    {
                        type = builtin
                        name = stereoR
                        label = copy
                    }
               ]
               links = [
                    { output = "mono:Out 1" input = "stereoL:In" }
                    { output = "mono:Out 1" input = "stereoR:In" }
               ]
               inputs = [ "mono:In 1" ]
               outputs = [ "stereoL:Out" "stereoR:Out" ]
            }
            capture.props = {
                node.name = "echo_cancel_stereo_capture"
                node.passive = true
                audio.channels = 1
            }
            playback.props = {
                node.name = "echo_cancel_stereo_source"
                media.class = Audio/Source
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.name = filter-chain-ec-stereo
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                # FIXME: WirePlumber seems to invert this
                filter.smart.before = [ filter-chain-ec-source filter-chain-source ]
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
        }
    }
]
