context.modules = [
    {
        name = libpipewire-module-echo-cancel
        flags = [ nofail ]
        args = {
            audio.channels = 1
            aec.args = {
                webrtc.noise_suppression = false
                webrtc.voice_detection = false
                webrtc.gain_control = true
            }
            capture.props = {
                node.name = "echo_cancel_capture"
                node.passive = true
                audio.channels = 1
            }
            playback.props = {
                node.name = "echo_cancel_playback"
                node.passive = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            source.props = {
                node.name = "echo_cancel_source"
                audio.channels = 1
                media.class = Audio/Source
                filter.smart = true
                filter.smart.name = filter-chain-ec-source
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                # FIXME: WirePlumber seems to invert this
                filter.smart.before = [ filter-chain-source ]
                filter.smart.after = [ filter-chain-ns ]
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
            sink.props = {
                node.name = "echo_cancel_sink"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.name = filter-chain-ec-sink
                filter.smart.target = { media.class = Audio/Sink }
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
        }
    }
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Noise Suppressor"
            media.name =  "Noise Suppressor"
            filter.graph = {
               nodes = [
                    {
                        type = ladspa
                        name = noise_suppressor_mono
                        plugin = /usr/lib/ladspa/audiofilter.so
                        label = noise_suppressor_mono
                        control = {
                           "VAD Threshold (%)" = 23
                           "VAD Grace Period (ms)" = 500
                           "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                    {
                        type = builtin
                        name = mono
                        label = mixer
                    }
                    {
                        type = builtin
                        name = stereoL
                        label = copy
                    }
                    {
                        type = builtin
                        name = stereoR
                        label = copy
                    }
               ]
               links = [
                    { output = "noise_suppressor_mono:Output" input = "mono:In 1" }
                    { output = "mono:Out" input = "stereoL:In" }
                    { output = "mono:Out" input = "stereoR:In" }
               ]
               inputs = [ "noise_suppressor_mono:Input" ]
               outputs = [ "stereoL:Out" "stereoR:Out" ]
            }
            capture.props = {
                node.name = "ns_capture"
                node.passive = true
                audio.channels = 1
            }
            playback.props = {
                node.name = "ns_source"
                media.class = Audio/Source
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.name = filter-chain-ns
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                # FIXME: WirePlumber seems to invert this
                filter.smart.before = [ filter-chain-ec-source filter-chain-source ]
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
        }
    }
]
