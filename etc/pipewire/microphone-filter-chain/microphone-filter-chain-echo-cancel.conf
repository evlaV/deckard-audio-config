context.properties = {
    steamos.filters.mic-eq = true
    steamos.filters.echo-cancellation = true
    steamos.filters.noise-suppression = true
}

context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Mic EQ"
            media.name =  "Mic EQ"
            filter.graph = {
               nodes = [
                    {
                        type = lv2
                        name = eq
                        plugin = "https://faustlv2.bitbucket.io/valve_deckard_microphone_neg3p6"
                        label = valve_deckard_microphone_neg3p6
                    }
                    {
                        type = builtin
                        name = mono_mixer
                        label = mixer
                    }
               ]
               links = [
                    { output = "eq:out0" input = "mono_mixer:In 1" }
                    { output = "eq:out1" input = "mono_mixer:In 2" }
               ]
               inputs = [ "eq:in0" "eq:in1" ]
               outputs = [ "mono_mixer:Out" ]
            }
            capture.props = {
                node.name = "eq_capture"
                node.passive = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "eq_source"
                media.class = Audio/Source
                audio.channels = 1
                audio.position = [ MONO ]
                filter.smart = true
                filter.smart.name = filter-chain-eq
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                # FIXME: WirePlumber seems to invert this
                filter.smart.after = [ filter-chain-ns filter-chain-ec-source ]
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
        }
        condition = [ { steamos.filters.mic-eq = true } ]
    }
    {
        name = libpipewire-module-echo-cancel
        flags = [ nofail ]
        args = {
            aec.args = {
                webrtc.noise_suppression = false
                webrtc.voice_detection = false
                webrtc.gain_control1.enabled = false
                webrtc.gain_control2.enabled = true

                # A longer explanation of these configuration parameters can be found at:
                # https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing/-/blob/master/webrtc/api/audio/audio_processing.h#L229

                # Commented values are the defaults, uncomment to change.

                # GainController1:
                #webrtc.gain_control1.enable_limiter = true
                #webrtc.gain_control1.target_level_dbfs = 3
                #webrtc.gain_control1.compression_gain_db = 9

                # GainController2:
                #webrtc.gain_control2.adaptive_digital.enabled = true
                #webrtc.gain_control2.adaptive_digital.headroom_db = 5.0
                #webrtc.gain_control2.adaptive_digital.max_gain_db = 50.0
                #webrtc.gain_control2.adaptive_digital.initial_gain_db = 15.0
                #webrtc.gain_control2.adaptive_digital.max_gain_change_db_per_second = 6.0
                #webrtc.gain_control2.adaptive_digital.max_output_noise_level_dbfs = -50.0
                #webrtc.gain_control2.fixed_digital.gain_db = 0.0

                # CaptureLevelAdjustment:
                #webrtc.capture_level_adjust.enabled = false
                #webrtc.capture_level_adjust.pre_gain_factor = 1.0
                #webrtc.capture_level_adjust.post_gain_factor = 1.0

                # AEC3 experiments:
                webrtc.force_mono_echo_reference = true
                webrtc.aec3.custom = true
                webrtc.aec3.filter.refined.length_blocks = 9
                webrtc.aec3.filter.refined_initial.length_blocks = 5
                webrtc.aec3.filter.coarse.length_blocks = 9
                webrtc.aec3.filter.coarse_initial.length_blocks = 5
                webrtc.aec3.delay.num_filters = 1
                webrtc.aec3.delay.down_sampling_factor = 8
                webrtc.aec3.delay.detect_pre_echo = false
                webrtc.aec3.echo_model.model_reverb_in_nonlinear_mode = true
            }
            capture.props = {
                node.name = "echo_cancel_capture"
                node.passive = true
                audio.channels = 1
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name = "echo_cancel_playback"
                node.passive = true
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            source.props = {
                node.name = "echo_cancel_source"
                audio.channels = 1
                audio.position = [ MONO ]
                media.class = Audio/Source
                filter.smart = true
                filter.smart.name = filter-chain-ec-source
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                # FIXME: WirePlumber seems to invert this
                filter.smart.before = [ filter-chain-eq ]
                filter.smart.after = [ filter-chain-ns ]
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
            sink.props = {
                node.name = "echo_cancel_sink"
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.name = filter-chain-ec-sink
                filter.smart.target = { media.class = Audio/Sink }
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
        }
        condition = [ { steamos.filters.echo-cancellation = true } ]
    }
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Noise Suppressor"
            media.name =  "Noise Suppressor"
            filter.graph = {
               nodes = [
                    {
                        type = ladspa
                        name = noise_suppressor_mono
                        plugin = /usr/lib/ladspa/audiofilter.so
                        label = noise_suppressor_mono
                        control = {
                           "VAD Threshold (%)" = 23
                           "VAD Grace Period (ms)" = 500
                           "Retroactive VAD Grace (ms)" = 0
                           "NS enable" = 1.0
                           # Set this to 1.0 if steamos.filters.mic-eq is false
                           "EQ enable" = 0.0
                        }
                    }
                    {
                        type = builtin
                        name = stereoL
                        label = copy
                    }
                    {
                        type = builtin
                        name = stereoR
                        label = copy
                    }
               ]
               links = [
                    { output = "noise_suppressor_mono:Output" input = "stereoL:In" }
                    { output = "noise_suppressor_mono:Output" input = "stereoR:In" }
               ]
               outputs = [ "stereoL:Out", "stereoR:Out" ]
            }
            capture.props = {
                node.name = "ns_capture"
                node.passive = true
                audio.channels = 1
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name = "ns_source"
                media.class = Audio/Source
                audio.channels = 2
                audio.position = [ FL FR ]
                filter.smart = true
                filter.smart.name = filter-chain-ns
                filter.smart.target = { media.class = Audio/Source, alsa.card_name = "SM8250 LPASS", device.profile.description = "Mic" }
                # FIXME: WirePlumber seems to invert this
                filter.smart.before = [ filter-chain-eq filter-chain-ec-source ]
                filter.smart.disabled = true
                steamos.mic_filter = true
            }
        }
        condition = [ { steamos.filters.noise-suppression = true } ]
    }
]
