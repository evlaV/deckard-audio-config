## access.conf: Used for hiding "internal" nodes like the filter-chain
## This file will hide the audio filter nodes for all applications by setting
## specific permissions on them.

access.rules = [
  {
    matches = [
      {
        access = "unrestricted"
        application.id = "org.valvesoftware.steam"
      }
      {
        access = "unrestricted"
        application.id = "org.kde.plasma-pa"
      }
      {
        access = "unrestricted"
        application.name = "SteamVR Audio"
      }
      {
        access = "unrestricted"
        application.name = "pavucontrol"
      }
    ]
    actions = {
      update-props = {
        default_permissions = "rwxm"
      }
      update-perms = [
        {
          matches = [
            { node.name = "~.*spatialize_filter_chain.*" }
          ]
          actions = {
            permissions = ""
          }
        }
      ]
    }
  }
  {
    matches = [
      {
        access = "flatpak"
        media.category = "Manager"
      }
    ]
    actions = {
      update-props = {
        access = "flatpak-manager"
        default_permissions = "rwxm",
      }
      update-perms = [
        {
          matches = [
            { node.name = "filter-chain-capture" }
            { node.name = "filter-chain-source" }
            { node.name = "filter-chain-playback" }
            { node.name = "filter-chain-sink" }
            { node.name = "dsp_capture" }
            { node.name = "dsp_source" }
            { node.name = "speaker-ref-sink" }
            { node.name = "speaker-ref-playback" }
            { node.name = "~echo_cancel.*" }
            {
              alsa.loopback = "true"
              media.class = "~Stream/*"
            }
            { node.create-loopback = "true" }
            { api.alsa.split.parent = "true" }
            { steamos.mic_filter = "true" }
            { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
          ]
          actions = {
            permissions = ""
          }
        }
      ]
    }
  }

  {
    matches = [
      {
        access = "flatpak"
        media.category = "!\"Manager\""
      }
    ]
    actions = {
      update-props = {
        default_permissions = "rx"
      }
      update-perms = [
        {
          matches = [
            { node.name = "filter-chain-capture" }
            { node.name = "filter-chain-source" }
            { node.name = "filter-chain-playback" }
            { node.name = "filter-chain-sink" }
            { node.name = "dsp_capture" }
            { node.name = "dsp_source" }
            { node.name = "speaker-ref-sink" }
            { node.name = "speaker-ref-playback" }
            { node.name = "~echo_cancel.*" }
            {
              alsa.loopback = "true"
              media.class = "~Stream/*"
            }
            { node.create-loopback = "true" }
            { api.alsa.split.parent = "true" }
            { steamos.mic_filter = "true" }
            { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
          ]
          actions = {
            permissions = ""
          }
        }
      ]
    }
  }

  {
    matches = [
      {
        access = "restricted"
      }
    ]
    actions = {
      update-props = {
        default_permissions = "rx"
      }
      update-perms = [
        {
          matches = [
            { node.name = "filter-chain-capture" }
            { node.name = "filter-chain-source" }
            { node.name = "filter-chain-playback" }
            { node.name = "filter-chain-sink" }
            { node.name = "dsp_capture" }
            { node.name = "dsp_source" }
            { node.name = "speaker-ref-sink" }
            { node.name = "speaker-ref-playback" }
            { node.name = "~echo_cancel.*" }
            {
              alsa.loopback = "true"
              media.class = "~Stream/*"
            }
            { node.create-loopback = "true" }
            { api.alsa.split.parent = "true" }
            { steamos.mic_filter = "true" }
            { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
          ]
          actions = {
            permissions = ""
          }
        }
      ]
    }
  }

  {
    matches = [
      {
        access = "default"
      }
    ]
    actions = {
      update-props = {
        default_permissions = "rwxm"
      }
      update-perms = [
        {
          matches = [
            { node.name = "filter-chain-capture" }
            { node.name = "filter-chain-source" }
            { node.name = "filter-chain-playback" }
            { node.name = "filter-chain-sink" }
            { node.name = "dsp_capture" }
            { node.name = "dsp_source" }
            { node.name = "speaker-ref-sink" }
            { node.name = "speaker-ref-playback" }
            { node.name = "~echo_cancel.*" }
            {
              alsa.loopback = "true"
              media.class = "~Stream/*"
            }
            { node.create-loopback = "true" }
            { api.alsa.split.parent = "true" }
            { steamos.mic_filter = "true" }
            { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
          ]
          actions = {
            permissions = ""
          }
        }
      ]
    }
  }

  {
    matches = [
      {
        access = "unrestricted"
        application.name = "!\"pipewire\""
        application.name = "!\"pw-dump\""
        application.name = "!\"pw-top\""
        application.name = "!\"wpctl\""
        application.name = "!\"WirePlumber\""
        application.name = "!\"WirePlumber [export]\""
      }
    ]
    actions = {
      update-props = {
        default_permissions = "rwxm"
      }
      update-perms = [
        {
          matches = [
            { node.name = "filter-chain-capture" }
            { node.name = "filter-chain-source" }
            { node.name = "filter-chain-playback" }
            { node.name = "filter-chain-sink" }
            { node.name = "dsp_capture" }
            { node.name = "dsp_source" }
            { node.name = "speaker-ref-sink" }
            { node.name = "speaker-ref-playback" }
            { node.name = "~echo_cancel.*" }
            {
              alsa.loopback = "true"
              media.class = "~Stream/*"
            }
            { node.create-loopback = "true" }
            { api.alsa.split.parent = "true" }
            { steamos.mic_filter = "true" }
            { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
          ]
          actions = {
            permissions = ""
          }
        }
      ]
    }
  }
]
