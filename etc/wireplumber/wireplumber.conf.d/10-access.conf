## access.conf: Used for hiding "internal" nodes like the filter-chain
## This file will hide the audio filter nodes for all applications by setting
## specific permissions on them.

access.permission-managers = [
  {
    name = "steamos-default-nospatial"
    default_permissions = "all"
    rules = [
      {
        matches = [
          { node.name = "filter-chain-capture" }
          { node.name = "filter-chain-source" }
          { node.name = "filter-chain-playback" }
          { node.name = "filter-chain-sink" }
          { node.name = "dsp_capture" }
          { node.name = "dsp_source" }
          { node.name = "speaker-ref-sink" }
          { node.name = "speaker-ref-playback" }
          { node.name = "~echo_cancel.*" }
          {
            alsa.loopback = "true"
            media.class = "~Stream/*"
          }
          { node.create-loopback = "true" }
          { api.alsa.split.parent = "true" }
          { steamos.mic_filter = "true" }
          { node.name = "~.*spatialize_filter_chain.*" }
        ]
        actions = {
          set-permissions = ""
        }
      }
    ]
  }

  {
    name = "steamos-restricted"
    default_permissions = "rx"
    rules = [
      {
        matches = [
          { node.name = "filter-chain-capture" }
          { node.name = "filter-chain-source" }
          { node.name = "filter-chain-playback" }
          { node.name = "filter-chain-sink" }
          { node.name = "dsp_capture" }
          { node.name = "dsp_source" }
          { node.name = "speaker-ref-sink" }
          { node.name = "speaker-ref-playback" }
          { node.name = "~echo_cancel.*" }
          {
            alsa.loopback = "true"
            media.class = "~Stream/*"
          }
          { node.create-loopback = "true" }
          { api.alsa.split.parent = "true" }
          { steamos.mic_filter = "true" }
          { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
        ]
        actions = {
          set-permissions = ""
        }
      }
    ]
  }

  {
    name = "steamos-default"
    default_permissions = "all"
    rules = [
      {
        matches = [
          { node.name = "filter-chain-capture" }
          { node.name = "filter-chain-source" }
          { node.name = "filter-chain-playback" }
          { node.name = "filter-chain-sink" }
          { node.name = "dsp_capture" }
          { node.name = "dsp_source" }
          { node.name = "speaker-ref-sink" }
          { node.name = "speaker-ref-playback" }
          { node.name = "~echo_cancel.*" }
          {
            alsa.loopback = "true"
            media.class = "~Stream/*"
          }
          { node.create-loopback = "true" }
          { api.alsa.split.parent = "true" }
          { steamos.mic_filter = "true" }
          { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
        ]
        actions = {
          set-permissions = ""
        }
      }
    ]
  }
]

access.rules = [
  {
    matches = [
      {
        access = "default"
        application.id = "org.valvesoftware.steam"
      }
      {
        access = "default"
        application.id = "org.kde.plasma-pa"
      }
      {
        access = "default"
        application.name = "SteamVR Audio"
      }
      {
        access = "default"
        application.name = "pavucontrol"
      }
    ]
    actions = {
      update-props = {
        permission_manager_name = "steamos-default-nospatial"
      }
    }
  }

  {
    matches = [
      {
        access = "flatpak"
        media.category = "Manager"
      }
    ]
    actions = {
      update-props = {
        access = "flatpak-manager"
        permission_manager_name = "steamos-default"
      }
    }
  }

  {
    matches = [
      {
        access = "flatpak"
        media.category = "!\"Manager\""
      }
    ]
    actions = {
      update-props = {
        permission_manager_name = "steamos-restricted"
      }
    }
  }

  {
    matches = [
      {
        access = "restricted"
      }
    ]
    actions = {
      update-props = {
        permission_manager_name = "steamos-restricted"
      }
    }
  }

  {
    matches = [
      {
        access = "default"
        application.name = "!\"pipewire\""
        application.id = "!\"org.valvesoftware.steam\""
        application.id = "!\"org.kde.plasma-pa\""
        application.name = "!\"SteamVR Audio\""
        application.name = "!\"pavucontrol\""
        # WARNING: This will be removed in a future update
        steamos.internal.voice_processing = "!false"
      }
    ]
    actions = {
      update-props = {
        permission_manager_name = "steamos-default"
      }
    }
  }
]
