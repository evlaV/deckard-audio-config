wireplumber.components = [
  {
    name = "metadata.lua",
    type = "script/lua",
    arguments = { "metadata.name" = "steamos-filters" },
    provides = "metadata.steamos-filters"
  }
  {
    name = "/etc/wireplumber/scripts/microphone-tracker.lua",
    type = "script/lua",
    provides = "steamos.microphone-tracker"
    requires = [ metadata.filters, metadata.steamos-filters ]
  }
]

wireplumber.profiles = {
  main = {
    "steamos.microphone-tracker" = "required"
  }
}

wireplumber.settings.schema = {
    steamos.mic-filters = {
        description = "Which filters to enable by default for microphones"
        type = "object"
        default = { builtin: { aec: true, ns: true }, external: { aec: true, ns: true } }
    }
}
