monitor.alsa.properties = {
  # Create a JACK device. This is not enabled by default because
  # it requires that the PipeWire JACK replacement libraries are
  # not used by the session manager, in order to be able to
  # connect to the real JACK server.
  #alsa.jack-device = false

  # Reserve devices via org.freedesktop.ReserveDevice1 on D-Bus
  # Disable if you are running a system-wide instance, which
  # doesn't have access to the D-Bus user session
  alsa.reserve = true
  #alsa.reserve.priority = -2,
  #alsa.reserve.application-name = "WirePlumber"

  # Enables MIDI functionality
  alsa.midi = true

  # Enables monitoring of alsa MIDI devices
  alsa.midi.monitoring = true

  # MIDI bridge node properties
  alsa.midi.node-properties = {
    # Name set for the node with ALSA MIDI ports
    node.name = "Midi-Bridge"
    # Removes longname/number from MIDI port names
    #api.alsa.disable-longname = true
  }
}

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.platform-*"
      }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
        device.routes.default-sink-volume = 0.6
        device.routes.default-source-volume = 1.0
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.platform-*"
      }
    ]
    actions = {
      update-props = {
        audio.channels        = 2
        audio.format          = "S16LE"
        audio.rate            = 48000
        audio.position        = "FL,FR"
        node.description      = "Built-in Audio Playback"
        priority.driver       = 800
        priority.session      = 800
        api.alsa.period-size  = 256
        api.alsa.headroom     = 1024
        node.force-quantum    = 480
        # use default session timeout (5 seconds)
        #session.suspend-timeout-seconds = 5
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.platform-*"
      }
    ]
    actions = {
      update-props = {
        audio.channels        = 2
        audio.format          = "S16LE"
        audio.rate            = 48000
        audio.position        = "FL,FR"
        node.description      = "Built-in Audio Capture"
        priority.driver       = 2200
        priority.session      = 2200
        api.alsa.period-size  = 256
        api.alsa.headroom     = 1024
        node.force-quantum    = 480
        # use default session timeout (5 seconds)
        #session.suspend-timeout-seconds = 5
        node.create-loopback  = true
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.usb-*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size   = 256
        api.alsa.headroom      = 1024
      }
    }
  }
]
