wireplumber.settings.schema = {
    node.stream.enable-spatial-audio = {
        description = "Whether to attempt spatialization of audio output streams"
        type = "bool"
        default = true
    }
    node.stream.enable-spatial-audio-surround = {
        description = "When spatializing audio output streams, whether to spatialize as a virtual 7.1 surround stream"
        type = "bool"
        default = false
    }
}
