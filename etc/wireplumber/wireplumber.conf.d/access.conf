access.rules = [
  {
    matches = [
      { access = "flatpak" }
      { access = "restricted" }
      { access = "default" }
      {
        access = "unrestricted"
        application.name = "!\"pipewire\""
        application.name = "!\"pw-dump\""
        application.name = "!\"pw-top\""
        application.name = "!\"wpctl\""
        application.name = "!\"helvum\""
        application.name = "!\"WirePlumber\""
        application.name = "!\"WirePlumber [export]\""
      }
    ]
    actions = {
      update-props = {
        default_permissions = "rwxm"
      }
      update-perms = [
        {
          matches = [
            { node.name = "filter-chain-capture" }
            { node.name = "filter-chain-source" }
            { node.name = "~echo_cancel.*" }
            {
              alsa.loopback = "true"
              media.class = "~Stream/*"
            }
            { node.create-loopback = "true" }
            { api.alsa.split.parent = "true" }
            { steamos.mic_filter = "true" }
          ]
          actions = {
            permissions = ""
          }
        }
      ]
    }
  }
]
