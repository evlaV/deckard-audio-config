[Unit]
# Wait until steamvr is running before we start up, so that we don't fail to VR_init() a bunch.
After=steamvr.service

# If steamvr stops, we want wireplumber to stop as well.  This ensures that
# if we've done a `steamvr setpath`, the next time we restart SteamVR, wireplumber gets restarted as well.
PartOf=steamvr.service