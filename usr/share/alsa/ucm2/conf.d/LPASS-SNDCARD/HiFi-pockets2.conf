SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='WSA_RX0 MIX INP' 'RX_MIX0'"
		cset "name='WSA_RX1 MIX INP' 'RX_MIX1'"
		cset "name='WSA_RX0 INP0' 'RX0'"
		cset "name='WSA_RX1 INP0' 'RX1'"
		cset "name='WSA_COMP1 Switch' on"
		cset "name='WSA_COMP2 Switch' on"
		cset "name='SpkrLeft COMP Switch' on"
		cset "name='SpkrLeft BOOST Switch' on"
		cset "name='SpkrLeft DAC Switch' on"
		cset "name='SpkrLeft VISENSE Switch' on"
		cset "name='SpkrRight COMP Switch' on"
		cset "name='SpkrRight BOOST Switch' on"
		cset "name='SpkrRight DAC Switch' on"
		cset "name='SpkrRight VISENSE Switch' on"
		cset "name='WSA_RX0 EC_HQ Switch' on"
		cset "name='WSA_RX1 EC_HQ Switch' on"
		cset "name='WSA RX_MIX EC0_MUX' 'RX_MIX_TX0'"
		cset "name='WSA RX_MIX EC1_MUX' 'RX_MIX_TX1'"
		cset "name='WSA_AIF_VI Mixer WSA_SPKR_VI_1' on"
		cset "name='WSA_AIF_VI Mixer WSA_SPKR_VI_2' on"
		cset "name='WSA_RX0 Digital Volume' 84"
		cset "name='WSA_RX1 Digital Volume' 84"
		cset "name='WSA_RX0_MIX Digital Volume' 84"
		cset "name='WSA_RX1_MIX Digital Volume' 84"
	]	

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},2"
		# FIXME: this or something else breaks volume control in steam
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}


SectionDevice."Headphones" {
	Comment "Headphones playback"

	EnableSequence [
		cset "name='RX_MACRO RX0 MUX' 'AIF1_PB'"
		cset "name='RX_MACRO RX1 MUX' 'AIF1_PB'"
		cset "name='RX_MACRO RX2 MUX' 'AIF2_PB'"
		cset "name='RX_MACRO RX3 MUX' 'AIF2_PB'"
		cset "name='RX INT0_1 MIX1 INP0' 'RX0'"
		cset "name='RX INT1_1 MIX1 INP0' 'RX1'"
		cset "name='RX INT0_2 MUX' 'RX2'"
		cset "name='RX INT1_2 MUX' 'RX3'"
		cset "name='RX INT0 DEM MUX' 'CLSH_DSM_OUT'"
		cset "name='RX INT1 DEM MUX' 'CLSH_DSM_OUT'"
		cset "name='RX_HPH PWR Mode' 'ULP'"
		cset "name='RX HPH Mode' 'CLS_H_ULP'"
		cset "name='RX_RX0 Digital Volume' 40"
		cset "name='RX_RX0 Mix Digital Volume' 40"
		cset "name='RX_RX1 Digital Volume' 40"
		cset "name='RX_RX1 Mix Digital Volume' 40"

		cset "name='RX MIX TX0 MUX' 'RX_MIX0'"
		cset "name='RX MIX TX1 MUX' 'RX_MIX1'"

		cset "name='HPHL Switch' on"
		cset "name='HPHR Switch' on"
		cset "name='HPHL_RDAC Switch' on"
		cset "name='HPHR_RDAC Switch' on"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
	}
}
