SectionVerb {
        Value {
            TQ "HiFi"
        }
}

SectionDevice."Speaker" {
        Comment "Speaker playback"

        Include.sm8250wsae.File "/codecs/sm8250-lpass/SpkrEnableSeq.conf"

        Value {
            PlaybackPCM "hw:${CardId},0"
        }
}

SectionDevice."Mic" {
        Comment "Mic"

        Include.sm8250vae.File "/codecs/sm8250-lpass/VAEnableSeq.conf"

        Value {
            CapturePCM "hw:${CardId},1"
        }
}
